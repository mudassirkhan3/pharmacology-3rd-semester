<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oncology Pharmacology Hub</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 10% 20%, rgb(124, 58, 237, 0.08) 0%, rgba(192, 38, 211, 0.05) 40%, #f8fafc 90%);
      --primary: #7c3aed;
      --accent: #d946ef;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #1e1b4b;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; padding: 40px 20px; color: var(--text-main); }
    .container { max-width: 1000px; margin: 0 auto; }
    
    /* Navigation & Layout */
    .view { display: none; animation: fadeIn 0.3s ease; }
    .active { display: block; }
    
    h1 { text-align: center; font-size: 2.5rem; margin-bottom: 30px; color: var(--primary); }
    
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
    .card { background: white; padding: 30px; border-radius: 20px; cursor: pointer; text-align: center; border: 2px solid #ede9fe; transition: 0.3s; box-shadow: var(--shadow); }
    .card:hover { transform: translateY(-5px); border-color: var(--primary); }
    .icon { font-size: 3rem; margin-bottom: 15px; }

    /* Detail View Styles */
    .detail-box { background: white; padding: 40px; border-radius: 20px; box-shadow: var(--shadow); }
    .back-btn { display: inline-block; padding: 10px 20px; background: var(--primary); color: white; text-decoration: none; border-radius: 10px; margin-bottom: 20px; }

    /* Embed Style */
    .embed-section { margin-top: 40px; background: white; padding: 20px; border-radius: 20px; box-shadow: var(--shadow); }
    iframe { width: 100%; height: 500px; border: none; border-radius: 10px; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  
  <!-- MAIN DASHBOARD VIEW -->
  <div id="home-view" class="view active">
    <h1>Oncology Pharmacology</h1>
    
    <div class="card-grid">
      <div class="card" onclick="showDetail('alkylating')"><div class="icon">⛓️</div><h3>Alkylating Agents</h3></div>
      <div class="card" onclick="showDetail('antimetabolites')"><div class="icon">🧩</div><h3>Antimetabolites</h3></div>
      <div class="card" onclick="showDetail('antibiotics')"><div class="icon">🧬</div><h3>Antitumor Antibiotics</h3></div>
      <div class="card" onclick="showDetail('microtubule')"><div class="icon">🧶</div><h3>Microtubule Inhibitors</h3></div>
      <div class="card" onclick="showDetail('hormones')"><div class="icon">🔑</div><h3>Hormones</h3></div>
      <div class="card" onclick="showDetail('mabs')"><div class="icon">🛡️</div><h3>Monoclonal Antibodies</h3></div>
      <div class="card" onclick="showDetail('tkis')"><div class="icon">📡</div><h3>TKIs</h3></div>
    </div>

    <div class="embed-section">
      <h2>Chapter 5 Reference</h2>
      <iframe src="https://mudassirkhan3.github.io/pharmacology-3rd-semester/chapter5.html"></iframe>
    </div>
  </div>

  <!-- DYNAMIC DETAIL VIEW -->
  <div id="detail-view" class="view">
    <a href="#" class="back-btn" onclick="showHome()">← Back to Dashboard</a>
    <div class="detail-box">
      <h2 id="detail-title">Title</h2>
      <p id="detail-content" style="margin-top:20px;"></p>
    </div>
  </div>

</div>

<script>
  // Data for each classification
  const db = {
    'alkylating': { title: 'Alkylating Agents', content: 'DNA cross-linking causing strand breakage. Includes Nitrogen mustards (Cyclophosphamide) and Platinums (Cisplatin). Monitor for bone marrow suppression.' },
    'antimetabolites': { title: 'Antimetabolites', content: 'Mimics natural bases to inhibit S-phase enzyme function. Examples include 5-FU and Methotrexate.' },
    'antibiotics': { title: 'Antitumor Antibiotics', content: 'Intercalation into DNA and Topoisomerase interference. Example: Doxorubicin (monitor for cardiotoxicity).' },
    'microtubule': { title: 'Microtubule Inhibitors', content: 'Inhibiting mitotic spindle formation to halt cell division. Examples: Vinca alkaloids, Taxanes.' },
    'hormones': { title: 'Hormones & Antagonists', content: 'Modulating receptor-mediated signaling pathways. Example: Tamoxifen (Estrogen receptor antagonist).' },
    'mabs': { title: 'Monoclonal Antibodies', content: 'Targeted binding to surface antigens for immune-mediated lysis. Monitor closely for infusion reactions.' },
    'tkis': { title: 'Tyrosine Kinase Inhibitors', content: 'Blocking intracellular growth signaling pathways. Example: Imatinib.' }
  };

  function showDetail(id) {
    document.getElementById('home-view').classList.remove('active');
    document.getElementById('detail-view').classList.add('active');
    document.getElementById('detail-title').innerText = db[id].title;
    document.getElementById('detail-content').innerText = db[id].content;
  }

  function showHome() {
    document.getElementById('detail-view').classList.remove('active');
    document.getElementById('home-view').classList.add('active');
  }
</script>

</body>
</html>
