<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access | Pharmacology-I BSN</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fdf4ff 100%); color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }

    /* Header */
    header { text-align: center; padding: 20px 0; }
    header h1 { font-size: 1.8rem; font-weight: 800; color: #0369a1; letter-spacing: -0.5px; margin-bottom: 4px; }
    header p { font-size: 0.9rem; color: #475569; font-weight: 600; }

    /* Main Container */
    .auth-wrapper { width: 100%; max-width: 440px; margin: 0 auto; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); overflow: hidden; }

    /* Tab Switches */
    .tab-header { display: flex; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
    .tab-btn { flex: 1; padding: 16px; text-align: center; font-weight: 700; font-size: 0.95rem; color: #64748b; background: none; border: none; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: white; color: #0284c7; border-bottom: 3px solid #0284c7; }

    /* Forms */
    .form-container { padding: 28px; display: none; }
    .form-container.active { display: block; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; outline: none; background: #f8fafc; transition: border-color 0.2s, box-shadow 0.2s; }
    .input-group input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); background: white; }

    .submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2); transition: opacity 0.2s; }
    .submit-btn:hover { opacity: 0.95; }

    /* Help Floating/Popup Button */
    .help-float { position: fixed; bottom: 25px; right: 25px; z-index: 100; }
    .help-btn { background: #0f172a; color: white; border: none; padding: 12px 20px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px; transition: transform 0.2s, background 0.2s; }
    .help-btn:hover { background: #0284c7; transform: translateY(-2px); }

    /* Modal Popup Box */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 101; padding: 20px; }
    .modal-card { background: white; width: 100%; max-width: 380px; padding: 24px; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); text-align: center; animation: popIn 0.25s ease-out; }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .modal-card h3 { color: #0284c7; font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
    .modal-card p { font-size: 0.9rem; color: #475569; margin-bottom: 20px; }
    .modal-close { background: #e2e8f0; color: #334155; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .modal-close:hover { background: #cbd5e1; }

    /* Footer */
    footer { text-align: center; font-size: 0.85rem; color: #64748b; padding: 20px 0; font-weight: 500; }
    footer span { color: #0284c7; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Pharmacology-I Portal</h1>
    <p>BSN 3rd Semester Student Secure Access</p>
  </header>

  <!-- Authentication Box -->
  <div class="auth-wrapper">
    <div class="tab-header">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="form-container active">
      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" required placeholder="student@nursing.edu">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="submit-btn">Login to Portal</button>
      </form>
    </div>

    <!-- Register Form -->
    <div id="register-form" class="form-container">
      <form onsubmit="handleRegister(event)">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" required placeholder="e.g. Mudassir Hussain Khan">
        </div>
        <div class="input-group">
          <label>Institute Name</label>
          <input type="text" required placeholder="e.g. New Life Institute of Nursing">
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" required placeholder="student@nursing.edu">
        </div>
        <div class="input-group">
          <label>Current Semester</label>
          <input type="text" required value="3rd Semester" placeholder="3rd Semester">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" required placeholder="Create secure password">
        </div>
        <button type="submit" class="submit-btn">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Help Pop Button -->
  <div class="help-float">
    <button class="help-btn" onclick="openModal()">
      💬 Need Help? Ask Admin
    </button>
  </div>

  <!-- Help Modal Overlay -->
  <div id="helpModal" class="modal-overlay">
    <div class="modal-card">
      <h3>Admin Assistance</h3>
      <p>Having trouble logging in or need portal access assistance? Contact your portal administrator directly.</p>
      <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>Developed with clinical precision by <span>Mudassir Hussain Khan</span></p>
  </footer>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const buttons = document.querySelectorAll('.tab-btn');

      buttons.forEach(btn => btn.classList.remove('active'));

      if (tab === 'login') {
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        buttons[0].classList.add('active');
      } else {
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        buttons[1].classList.add('active');
      }
    }

    function openModal() {
      document.getElementById('helpModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('helpModal').style.display = 'none';
    }

    function handleLogin(e) {
      e.preventDefault();
      alert('Login successful! Redirecting to your Pharmacology Portal...');
    }

    function handleRegister(e) {
      e.preventDefault();
      alert('Account registered successfully! Welcome to the portal.');
    }
  </script>

</body>
</html>
