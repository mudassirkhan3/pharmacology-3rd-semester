<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access &amp; Authentication | Pharmacology-I BSN</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fdf4ff 100%); color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }

    /* Header */
    header { text-align: center; padding: 20px 0; }
    header h1 { font-size: 1.8rem; font-weight: 800; color: #0369a1; letter-spacing: -0.5px; margin-bottom: 4px; }
    header p { font-size: 0.9rem; color: #475569; font-weight: 600; }

    /* Main Container */
    .auth-wrapper { width: 100%; max-width: 440px; margin: 0 auto; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); overflow: hidden; }

    /* Tab Switches */
    .tab-header { display: flex; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; }
    .tab-btn { flex: 1; padding: 16px; text-align: center; font-weight: 700; font-size: 0.95rem; color: #64748b; background: none; border: none; cursor: pointer; transition: all 0.2s; }
    .tab-btn.active { background: white; color: #0284c7; border-bottom: 3px solid #0284c7; }

    /* Forms */
    .form-container { padding: 28px; display: none; }
    .form-container.active { display: block; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .input-group input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.95rem; outline: none; background: #f8fafc; transition: border-color 0.2s, box-shadow 0.2s; }
    .input-group input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); background: white; }

    .submit-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2); transition: opacity 0.2s; }
    .submit-btn:hover { opacity: 0.95; }

    .switch-prompt { text-align: center; margin-top: 16px; font-size: 0.85rem; color: #64748b; }
    .switch-prompt a { color: #0284c7; font-weight: 700; text-decoration: none; cursor: pointer; }
    .switch-prompt a:hover { text-decoration: underline; }

    /* WhatsApp Help Floating Button */
    .help-float { position: fixed; bottom: 25px; right: 25px; z-index: 100; }
    .help-btn { background: #25d366; color: white; border: none; padding: 12px 20px; border-radius: 30px; font-weight: 700; font-size: 0.85rem; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 8px; text-decoration: none; transition: transform 0.2s, background 0.2s; }
    .help-btn:hover { background: #22bf5b; transform: translateY(-2px); }

    /* Footer */
    footer { text-align: center; font-size: 0.85rem; color: #64748b; padding: 20px 0; font-weight: 500; }
    footer span { color: #0284c7; font-weight: 700; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Pharmacology-I Portal</h1>
    <p>BSN 3rd Semester Secure Authentication</p>
  </header>

  <!-- Authentication Box -->
  <div class="auth-wrapper">
    <div class="tab-header">
      <button class="tab-btn active" id="btn-login-tab" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="btn-reg-tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="form-container active">
      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="login-email" required placeholder="student@nursing.edu">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="login-pass" required placeholder="••••••••">
        </div>
        <button type="submit" class="submit-btn">Login to Dashboard</button>
      </form>
      <div class="switch-prompt">
        Don't have an account? <a onclick="switchTab('register')">Register first</a>
      </div>
    </div>

    <!-- Register Form -->
    <div id="register-form" class="form-container">
      <form onsubmit="handleRegister(event)">
        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="reg-name" required placeholder="e.g. Mudassir Hussain Khan">
        </div>
        <div class="input-group">
          <label>Institute Name</label>
          <input type="text" id="reg-institute" required placeholder="New Life Institute of Nursing">
        </div>
        <div class="input-group">
          <label>Email Address</label>
          <input type="email" id="reg-email" required placeholder="student@nursing.edu">
        </div>
        <div class="input-group">
          <label>Current Semester</label>
          <input type="text" id="reg-semester" required value="3rd Semester">
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="reg-pass" required placeholder="Create secure password">
        </div>
        <button type="submit" class="submit-btn">Register Account</button>
      </form>
      <div class="switch-prompt">
        Already registered? <a onclick="switchTab('login')">Login here</a>
      </div>
    </div>
  </div>

  <!-- WhatsApp Admin Help Button -->
  <div class="help-float">
    <a href="https://wa.me/923241064487?text=Hello%20Mudassir,%20I%20need%20help%20with%20my%20Pharmacology%20portal%20access." target="_blank" class="help-btn">
      💬 Need Help? WhatsApp Admin
    </a>
  </div>

  <!-- Footer -->
  <footer>
    <p>Developed with clinical precision by <span>Mudassir Hussain Khan</span></p>
  </footer>

  <script>
    function switchTab(tab) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const loginTabBtn = document.getElementById('btn-login-tab');
      const regTabBtn = document.getElementById('btn-reg-tab');

      if (tab === 'login') {
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        loginTabBtn.classList.add('active');
        regTabBtn.classList.remove('active');
      } else {
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
        regTabBtn.classList.add('active');
        loginTabBtn.classList.remove('active');
      }
    }

    // Register User and store credentials strictly
    function handleRegister(e) {
      e.preventDefault();
      const userData = {
        name: document.getElementById('reg-name').value.trim(),
        institute: document.getElementById('reg-institute').value.trim(),
        email: document.getElementById('reg-email').value.trim().toLowerCase(),
        semester: document.getElementById('reg-semester').value.trim(),
        password: document.getElementById('reg-pass').value
      };

      localStorage.setItem('pharmacologyRegisteredUser', JSON.stringify(userData));
      alert('Registration successful! Please switch to the Login tab and enter your credentials to open your dashboard.');
      switchTab('login');
    }

    // Strict Login verification against registered credentials
    function handleLogin(e) {
      e.preventDefault();
      const inputEmail = document.getElementById('login-email').value.trim().toLowerCase();
      const inputPass = document.getElementById('login-pass').value;

      const savedUserJSON = localStorage.getItem('pharmacologyRegisteredUser');

      if (!savedUserJSON) {
        alert('Access Denied: No account found! Please register first before trying to log in.');
        switchTab('register');
        return;
      }

      const savedUser = JSON.parse(savedUserJSON);

      if (inputEmail === savedUser.email && inputPass === savedUser.password) {
        // Save active session
        localStorage.setItem('pharmacologyUser', JSON.stringify(savedUser));
        alert('Login successful! Redirecting to your dashboard...');
        window.location.href = 'dashboard.html';
      } else {
        alert('Error: Incorrect email or password. Please check your credentials or register if you haven\'t.');
      }
    }
  </script>

</body>
</html>
