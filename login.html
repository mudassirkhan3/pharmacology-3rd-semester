<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access | Pharmacology-I BSN</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f1f5f9; color: #0f172a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

    /* Login Box Container */
    .login-container { background: white; width: 100%; max-width: 420px; padding: 36px 30px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; }
    .login-header { text-align: center; margin-bottom: 28px; }
    .login-header h1 { font-size: 1.4rem; font-weight: 800; color: #0369a1; letter-spacing: -0.5px; margin-bottom: 6px; }
    .login-header p { font-size: 0.85rem; color: #64748b; font-weight: 500; }

    /* Form Styles */
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 0.9rem; font-weight: 600; outline: none; background: #f8fafc; color: #0f172a; transition: all 0.2s; }
    .form-input:focus { border-color: #0284c7; background: white; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12); }

    .login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 6px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); transition: opacity 0.2s; }
    .login-btn:hover { opacity: 0.92; }

    .help-text { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #64748b; }
    .help-text span { color: #0284c7; font-weight: 700; }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h1>Pharmacology-I Portal</h1>
      <p>Enter your details to access student dashboard</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="studentName" class="form-input" placeholder="e.g. Mudassir Hussain Khan" required>
      </div>

      <div class="form-group">
        <label>Institute Name</label>
        <input type="text" id="studentInstitute" class="form-input" value="New Life Institute of Nursing" required>
      </div>

      <div class="form-group">
        <label>Student Email / Roll No</label>
        <input type="text" id="studentEmail" class="form-input" placeholder="e.g. rollno 002075" required>
      </div>

      <div class="form-group">
        <label>Semester</label>
        <input type="text" id="studentSemester" class="form-input" value="4th Semester" required>
      </div>

      <button type="submit" class="login-btn">Proceed to Dashboard →</button>
    </form>

    <div class="help-text">
      <p>Protected Student Portal • Developed by <span>Mudassir Hussain Khan</span></p>
    </div>
  </div>

  <script>
    // If user is already logged in, redirect straight to dashboard
    window.onload = function() {
      if (localStorage.getItem('pharmacologyLoggedIn') === 'true') {
        window.location.href = 'dashboard.html';
      }
    };

    function handleLogin(event) {
      event.preventDefault();

      const userData = {
        name: document.getElementById('studentName').value.trim(),
        institute: document.getElementById('studentInstitute').value.trim(),
        email: document.getElementById('studentEmail').value.trim(),
        semester: document.getElementById('studentSemester').value.trim()
      };

      // Save session state
      localStorage.setItem('pharmacologyUser', JSON.stringify(userData));
      localStorage.setItem('pharmacologyLoggedIn', 'true');

      // Redirect to dashboard
      window.location.href = 'dashboard.html';
    }
  </script>

</body>
</html>
